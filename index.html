<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#006575,#00b4d8,#90e0ef);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    padding:20px;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:100%;
    max-width:950px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.15);
    border-radius:20px;
    padding:30px;
    box-shadow:0 25px 45px rgba(0,0,0,0.2);
    border:1px solid rgba(255,255,255,0.3);
    color:white;
}

h2{
    text-align:center;
    margin-bottom:25px;
    font-weight:700;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    text-align:center;
}

tbody tr{
    background:rgba(255,255,255,0.1);
    transition:0.3s;
    cursor:pointer;
}

tbody tr:hover{
    background:rgba(255,255,255,0.25);
    transform:scale(1.01);
}

.rank1{ background: linear-gradient(45deg,gold,orange); color:black; font-weight:700;}
.rank2{ background: linear-gradient(45deg,silver,#dcdcdc); color:black; font-weight:700;}
.rank3{ background: linear-gradient(45deg,#cd7f32,#a0522d); color:white; font-weight:700;}

.badge{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.gold{ background:gold; color:black; }
.silver{ background:silver; color:black; }
.bronze{ background:#cd7f32; color:white; }

.info{
    margin-top:10px;
    font-size:13px;
    text-align:center;
    opacity:0.8;
}
</style>
</head>
<body>

<div class="card">
    <h2>Ranking Video KKN 65 Umpalembang</h2>
    <div class="info">Tekan & tahan 2 detik pada baris untuk menghapus data</div>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Video</th>
                <th>Rata-rata (%)</th>
                <th>Jumlah Penilai</th>
            </tr>
        </thead>
        <tbody id="tabel"></tbody>
    </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyCZAfnelUdrwUz856j2hC3yJWqUm-JJmiI",
    authDomain: "ruangbelajar-52a67.firebaseapp.com",
    databaseURL: "https://ruangbelajar-52a67-default-rtdb.firebaseio.com",
    projectId: "ruangbelajar-52a67",
    storageBucket: "ruangbelajar-52a67.appspot.com",
    messagingSenderId: "545318863560",
    appId: "1:545318863560:web:df392c010ff914aad49bfd"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tabel = document.getElementById("tabel");

onValue(ref(db, "penilaian"), (snapshot) => {

    let data = snapshot.val();
    tabel.innerHTML = "";

    if(!data) return;

    let hasilAkhir = [];

    for(let video in data){

        let totalSemua = 0;
        let jumlahJuri = 0;

        for(let kelompok in data[video]){
            totalSemua += parseFloat(data[video][kelompok].nilai100);
            jumlahJuri++;
        }

        let rataVideo = (totalSemua / jumlahJuri).toFixed(2);

        hasilAkhir.push({
            video: video,
            rata: rataVideo,
            jumlah: jumlahJuri
        });
    }

    hasilAkhir.sort((a,b) => b.rata - a.rata);

    hasilAkhir.forEach((item,index) => {

        let rankClass="";
        if(index===0) rankClass="rank1";
        else if(index===1) rankClass="rank2";
        else if(index===2) rankClass="rank3";

        let tr = document.createElement("tr");
        tr.className = rankClass;

        tr.innerHTML = `
            <td>${index+1}</td>
            <td>${item.video}</td>
            <td>${item.rata}%</td>
            <td>${item.jumlah}</td>
        `;

        // ✅ Klik untuk konfirmasi hapus
        tr.addEventListener("click", async function(){

            let konfirmasi = confirm(
                "⚠ Apakah Anda yakin ingin menghapus semua penilaian untuk " 
                + item.video + " ?"
            );

            if(konfirmasi){
                await remove(ref(db,"penilaian/"+item.video));
                alert("Data berhasil dihapus!");
            }

        });

        tabel.appendChild(tr);
    });

});
</script>


</body>
</html>
